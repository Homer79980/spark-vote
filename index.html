<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark工作室 - 内部投票系统</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        /* --- 基础样式 --- */
        :root { --spark-bg: #f1f2f6; --spark-dark: #2d3436; --spark-blue: #0984e3; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--spark-bg); margin: 0; padding: 20px; color: var(--spark-dark); -webkit-font-smoothing: antialiased; }
        .container { max-width: 1100px; margin: 0 auto; padding-bottom: 60px; }
        
        .header-box { text-align: center; margin-bottom: 30px; border-bottom: 3px solid #ccc; padding-bottom: 10px; }
        h1 { margin: 0; color: var(--spark-dark); letter-spacing: 2px; font-size: 1.8rem; }
        .sub-title { color: #666; font-weight: bold; font-size: 1rem; margin-top: 5px; }

        /* === 布局优化 === */
        .vote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card { 
            background: white; border-radius: 8px; overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; 
            display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.03);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }

        .card-img-wrapper { 
            width: 100%; height: 160px; overflow: hidden; cursor: zoom-in; position: relative; 
            background: #f8f9fa; padding: 12px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
        }
        .card-img-wrapper img { 
            max-width: 100%; max-height: 100%; width: auto; height: auto; 
            object-fit: contain; 
            transition: 0.3s; border-radius: 4px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
        }
        .card:hover .card-img-wrapper img { transform: scale(1.05); } 

        .card-body { padding: 15px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-name { font-size: 1rem; font-weight: bold; margin-bottom: 8px; display: block; line-height: 1.3; }
        
        .progress-box { height: 6px; background: #eee; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #ccc; width: 0%; transition: width 0.3s ease; }
        .stats { font-size: 0.8rem; color: #999; margin-bottom: 12px; font-family: monospace; }

        .vote-action-btn { 
            width: 100%; background: #fff; color: #333; 
            border: 1px solid #ddd; padding: 8px; border-radius: 4px; 
            font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.1s;
        }
        .vote-action-btn:hover { background: #f0f0f0; }
        .vote-action-btn.selected { background: #e1f5fe !important; color: #0984e3 !important; border-color: #0984e3 !important; }
        .vote-action-btn.selected:hover { background: #ffeaa7 !important; color: #d63031 !important; border-color: #d63031 !important; }
        .vote-action-btn.disabled { opacity: 0.5; cursor: not-allowed; background: #eee; }

        .group-section { margin-bottom: 40px; animation: fadeIn 0.5s ease; }
        .group-title { 
            font-size: 1.2rem; padding: 10px 15px; margin-bottom: 15px; color: var(--spark-dark);
            border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
            background: white; border-left: 5px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .group-status { font-size: 11px; background: #eee; padding: 3px 8px; border-radius: 12px; color: #666; }
        .group-status.voted { background: #00b894; color: white; }

        #toast-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0,0,0,0.8); color: white; padding: 20px 30px; border-radius: 12px;
            text-align: center; pointer-events: none; opacity: 0; transition: all 0.2s; z-index: 10000;
        }
        #toast-box.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .toast-icon { font-size: 32px; display: block; margin-bottom: 5px; }

        /* === 管理面板 & 数据看板 === */
        #admin-panel { display: none; background: #fff; padding: 25px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .stats-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; background: #f1f2f6; padding: 15px; border-radius: 8px; }
        .stat-card { background: white; padding: 15px; border-radius: 6px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-num { font-size: 24px; font-weight: bold; color: var(--spark-blue); display: block; margin-bottom: 5px; }
        .stat-label { font-size: 12px; color: #999; }
        .config-bar { background: #e3f2fd; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #0277bd; font-size: 14px; }
        .admin-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; background: #fafafa; padding: 8px; border: 1px solid #eee; }
        .edit-group { cursor: pointer; }
        .drop-zone { flex: 2; border: 2px dashed #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; cursor: pointer; min-height: 60px; }
        .drop-zone img.preview-thumb { height: 50px; }
        .save-status { margin: 12px 0; font-size: 13px; line-height: 1.6; color: #636e72; overflow-wrap: anywhere; }
        .save-status.error { color: #c0392b; }
        .save-status.success { color: #00856b; }
        button:disabled { opacity: 0.55; cursor: wait; }
        .admin-item input { min-width: 0; width: 100%; box-sizing: border-box; }
        .admin-item > div { min-width: 0; }
        .drop-zone { position: relative; overflow: hidden; }
        .drop-zone.processing::after { content: '正在处理…'; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.9); }
        @media (max-width: 600px) {
            body { padding: 12px; }
            #admin-panel { padding: 14px; }
            .stats-dashboard { gap: 6px; padding: 6px; }
            .stat-card { padding: 8px 4px; }
            .admin-item { flex-wrap: wrap; }
            .admin-item .drop-zone { flex-basis: 100%; min-height: 80px; }
        }
        
        /* === 弹窗 (画廊模式) 升级样式 === */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; justify-content: center; align-items: center; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; cursor: pointer; z-index: 10001; opacity: 0.7; transition: 0.2s; }
        .modal-close:hover { opacity: 1; transform: scale(1.1); }
        
        .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: white; border: none; font-size: 30px; padding: 15px 20px; cursor: pointer; border-radius: 8px; transition: 0.3s; z-index: 10000; user-select: none; }
        .modal-nav:hover { background: rgba(255,255,255,0.3); }
        .modal-nav.prev { left: 20px; }
        .modal-nav.next { right: 20px; }

        .modal-content-wrapper { display: flex; flex-direction: column; align-items: center; max-width: 80%; max-height: 90vh; }
        #modal img { max-width: 100%; max-height: 70vh; border: 3px solid #fff; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .modal-footer { margin-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 12px; }
        #modalItemName { color: white; font-size: 1.4rem; font-weight: bold; letter-spacing: 1px; }
        #modalVoteBtn { padding: 10px 30px; font-size: 1.1rem; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; min-width: 150px; }
        #modalVoteBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .footer { text-align: center; margin-top: 50px; color: #ccc; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1 id="mainTitle">SPARK STUDIO</h1>
        <div class="sub-title">内部决策投票系统</div>
    </div>

    <div id="toast-box"><div class="toast-icon">👍</div><span class="toast-text">成功</span></div>

    <div id="admin-panel">
        <h3 style="margin-top:0">📊 数据看板</h3>
        <div class="stats-dashboard">
            <div class="stat-card"><span class="stat-num" id="stat-headcount">0</span><span class="stat-label">👥 参与人数</span></div>
            <div class="stat-card"><span class="stat-num" id="stat-totalvotes">0</span><span class="stat-label">🎫 累计票数</span></div>
            <div class="stat-card"><span class="stat-num" id="stat-topgroup">-</span><span class="stat-label">🔥 最热分组</span></div>
        </div>

        <h3 style="margin-top:0">🛠 选项管理</h3>
        <div class="config-bar">
            <span>⚙️ <b>规则：</b>每组每人限投</span>
            <input type="number" id="maxVoteInput" min="1" max="99" value="1" style="width: 40px; text-align:center;">
            <span>票</span>
        </div>
        <datalist id="group-suggestions"></datalist>
        <div id="admin-list"></div>
        <div style="display:flex; gap:10px; margin-top:15px; flex-wrap:wrap;">
            <button onclick="addNewRow()" style="background:#0984e3; color:white; flex:1; padding:10px;">+ 新增</button>
            <button id="save-button" onclick="saveAll()" style="background:#2d3436; color:white; flex:2; padding:10px;">💾 保存更新</button>
            <button onclick="exportData()" style="background:#00b894; color:white; flex:1.5; padding:10px;">📥 导出Excel</button>
        </div>
        <p id="save-status" class="save-status" role="status" aria-live="polite">正在连接，请稍候…</p>
        <div style="margin-top:20px; border-top:1px dashed #ccc; padding-top:15px; display:flex; gap:10px;">
            <button onclick="resetAllVotes()" style="color:#d63031; background:white; border:1px solid #fab1a0; flex:1; font-size:12px;">⚠️ 清空所有 (含人数)</button>
            <button onclick="deleteAllItems()" style="color:#d63031; background:white; border:1px solid #fab1a0; flex:1; font-size:12px;">🗑️ 删除所有</button>
        </div>
    </div>

    <div id="voteContainer"></div>
    <div class="footer" onclick="toggleAdmin()">Spark Studio Internal | 管理入口</div>
</div>

<div id="modal" onclick="closeModal(event)">
    <span class="modal-close" onclick="closeModal(event)">✕</span>
    <button class="modal-nav prev" onclick="prevImage(event)">&#10094;</button>
    
    <div class="modal-content-wrapper" onclick="event.stopPropagation()">
        <img id="modalImg" src="">
        <div class="modal-footer">
            <span id="modalItemName">项目名称</span>
            <button id="modalVoteBtn" onclick="modalToggleVote(event)">👍 投一票</button>
        </div>
    </div>
    
    <button class="modal-nav next" onclick="nextImage(event)">&#10095;</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://playa-dc7ae-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentData = { items: [], headcount: 0 }; 
    let isAdmin = false;
    let globalMaxVotes = 1;
    let currentModalIndex = 0; // 新增：用于记录当前弹窗展示的图片索引
    const colorPalette = ['#0984e3', '#00b894', '#6c5ce7', '#e17055', '#fdcb6e', '#e84393', '#2d3436', '#00cec9'];
    let groupColorMap = {};
    let adminDirty = false;
    let saving = false;
    let processingImages = 0;
    let dataLoaded = false;
    let databaseConnected = false;
    let editorBaseline = '';

    function setSaveStatus(message, kind = '') {
        const status = document.getElementById('save-status');
        status.textContent = message;
        status.className = `save-status ${kind}`;
    }

    function markAdminDirty() {
        adminDirty = true;
        setSaveStatus('有未保存的修改，请点击“保存更新”。');
    }

    function metadataSignature(data) {
        return JSON.stringify({ round: data.round || 0, maxVotes: data.maxVotes || 1,
            items: (data.items || []).map(item => item && ({ name: item.name || '', group: item.group || '', url: item.url || '' })) });
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('admin-list').addEventListener('input', markAdminDirty);
    document.getElementById('maxVoteInput').addEventListener('input', markAdminDirty);
    window.addEventListener('beforeunload', event => {
        if (adminDirty || saving || processingImages) { event.preventDefault(); event.returnValue = ''; }
    });
    db.ref('.info/connected').on('value', snapshot => {
        databaseConnected = snapshot.val() === true;
        if (!databaseConnected) setSaveStatus('连接已断开，编辑内容仍在当前页面。请等待连接恢复后保存。', 'error');
        else if (!adminDirty && !saving) setSaveStatus('已连接，可以编辑并保存。');
    });

    // --- 实时监听 ---
    db.ref('sparkVote').on('value', (snapshot) => {
        const data = snapshot.val() || { items: [], round: 0, maxVotes: 1, headcount: 0 };
        currentData = data;
        dataLoaded = true;
        globalMaxVotes = data.maxVotes || 1;
        checkRoundVersion(data.round || 0);
        renderUserView(data.items || []);
        
        // 如果弹窗开着，同步刷新弹窗里的按钮状态（防止别人投票影响当前状态）
        if (document.getElementById('modal').style.display === 'flex') {
            updateModalUI();
        }
        
        if (isAdmin) {
            updateDashboard(data);
            if (!adminDirty && !saving && !processingImages) {
                renderAdminView(data.items || []);
                updateGroupSuggestions(data.items || []);
                document.getElementById('maxVoteInput').value = globalMaxVotes;
            }
        }
    }, error => setSaveStatus(`读取失败，暂不能保存：${error.message || error.code}`, 'error'));

    function checkRoundVersion(serverRound) {
        const localRound = parseInt(localStorage.getItem('spark_vote_round') || '-1');
        if (serverRound > localRound) {
            localStorage.setItem('spark_vote_round', serverRound);
            localStorage.removeItem('spark_voted_log');
            localStorage.removeItem('spark_has_counted');
        }
    }
    
    function getLocalLog() { return JSON.parse(localStorage.getItem('spark_voted_log') || '{}'); }

    // --- 渲染前台视图 ---
    function renderUserView(items) {
        const container = document.getElementById('voteContainer');
        container.innerHTML = '';
        const totalVotes = items.reduce((sum, item) => sum + (item.votes || 0), 0);
        const groupedItems = {};
        const log = getLocalLog();

        items.forEach((item, index) => {
            const groupName = item.group || '默认分组';
            if (!groupedItems[groupName]) groupedItems[groupName] = [];
            groupedItems[groupName].push({ ...item, originalIndex: index });
        });

        Object.keys(groupedItems).forEach((groupName, gIndex) => {
            const groupLog = log[groupName] || [];
            const votedCount = groupLog.length;
            const votesLeft = globalMaxVotes - votedCount;
            const isFull = votesLeft <= 0;

            if (!groupColorMap[groupName]) groupColorMap[groupName] = colorPalette[gIndex % colorPalette.length];
            const themeColor = groupColorMap[groupName];

            const section = document.createElement('div');
            section.className = 'group-section';
            
            if (Object.keys(groupedItems).length > 1 || groupName !== '默认分组') {
                const statusHtml = isFull 
                    ? `<span class="group-status voted">✅ 已完成</span>` 
                    : `<span class="group-status">剩余 ${votesLeft} 票</span>`;
                section.innerHTML = `<h2 class="group-title" style="border-left-color: ${themeColor}"><span style="color: ${themeColor}">${escapeHtml(groupName)}</span> ${statusHtml}</h2>`;
            }

            const grid = document.createElement('div');
            grid.className = 'vote-grid';

            groupedItems[groupName].forEach(item => {
                const percent = totalVotes === 0 ? 0 : Math.round((item.votes / totalVotes) * 100);
                const isSelected = groupLog.includes(item.originalIndex);
                let btnClass = "vote-action-btn";
                let btnText = "👍 投一票";
                let btnStyle = `style="border-color:${themeColor}; color:${themeColor}"`;
                let clickAction = `data-group="${escapeHtml(groupName)}" onclick="toggleVote(${item.originalIndex}, this.dataset.group)"`;

                if (isSelected) {
                    btnClass += " selected"; btnText = "✅ 已选 (撤销)"; btnStyle = "";
                } else if (isFull) {
                    btnClass += " disabled"; btnText = "⛔ 票数已满"; clickAction = ""; btnStyle = "";
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper" onclick="openModal(${item.originalIndex})">
                        <img id="img-${item.originalIndex}" src="${escapeHtml(item.url || 'https://via.placeholder.com/400x300?text=No+Image')}">
                    </div>
                    <div class="card-body">
                        <div>
                            <span class="card-name">${escapeHtml(item.name || '未命名')}</span>
                            <div class="progress-box"><div class="progress-fill" style="width: ${percent}%; background:${themeColor}"></div></div>
                            <div class="stats">${item.votes || 0} 票 (${percent}%)</div>
                        </div>
                        <button class="${btnClass}" ${clickAction} ${btnStyle}>${btnText}</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            container.appendChild(section);
        });
        if (items.length === 0) container.innerHTML = '<div style="text-align:center; padding:50px; color:#999">暂无项目</div>';
    }

    // --- 投票核心逻辑 ---
    function toggleVote(index, groupName) {
        let log = getLocalLog();
        if (!log[groupName]) log[groupName] = [];
        const isSelected = log[groupName].includes(index);

        if (isSelected) {
            if (!confirm("确定要撤销这一票吗？")) return;
            currentData.items[index].votes = (currentData.items[index].votes || 1) - 1;
            log[groupName] = log[groupName].filter(i => i !== index);
            localStorage.setItem('spark_voted_log', JSON.stringify(log));
            renderUserView(currentData.items);
            showToast("🗑️ 已撤销", "🗑️");
            db.ref(`sparkVote/items/${index}/votes`).transaction((v) => (v || 0) - 1);
        } else {
            if (log[groupName].length >= globalMaxVotes) return showToast("⛔ 票数已用尽", "⛔");
            currentData.items[index].votes = (currentData.items[index].votes || 0) + 1;
            log[groupName].push(index);
            localStorage.setItem('spark_voted_log', JSON.stringify(log));
            renderUserView(currentData.items);
            showToast("👍 投票成功", "👍");
            db.ref(`sparkVote/items/${index}/votes`).transaction((v) => (v || 0) + 1);
            if (!localStorage.getItem('spark_has_counted')) {
                db.ref('sparkVote/headcount').transaction((h) => (h || 0) + 1);
                localStorage.setItem('spark_has_counted', 'true');
            }
        }
    }

    function showToast(text, icon) {
        const box = document.getElementById('toast-box');
        box.querySelector('.toast-icon').innerText = icon;
        box.querySelector('.toast-text').innerText = text;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 1000);
    }
    
    // === 弹窗画廊模式相关逻辑 ===
    function openModal(index) { 
        currentModalIndex = parseInt(index);
        updateModalUI();
        document.getElementById('modal').style.display = 'flex'; 
        document.body.style.overflow = 'hidden'; 
    }

    // 更新弹窗内的图片、文字和按钮状态
    function updateModalUI() {
        if (!currentData.items || currentData.items.length === 0) return;
        const item = currentData.items[currentModalIndex];
        
        document.getElementById('modalImg').src = item.url || 'https://via.placeholder.com/800x600?text=No+Image';
        document.getElementById('modalItemName').innerText = item.name || '未命名';

        // 刷新弹窗内的投票按钮状态
        const groupName = item.group || '默认分组';
        const log = getLocalLog();
        const groupLog = log[groupName] || [];
        const isSelected = groupLog.includes(currentModalIndex);
        const votesLeft = globalMaxVotes - groupLog.length;
        
        const btn = document.getElementById('modalVoteBtn');
        const themeColor = groupColorMap[groupName] || "#0984e3";

        if (isSelected) {
            btn.innerText = "✅ 已选 (点击撤销)";
            btn.style.background = "#e1f5fe";
            btn.style.color = "#0984e3";
        } else if (votesLeft <= 0) {
            btn.innerText = "⛔ 本组票数已满";
            btn.style.background = "#555";
            btn.style.color = "#ccc";
        } else {
            btn.innerText = `👍 投一票 (${groupName})`;
            btn.style.background = themeColor;
            btn.style.color = "white";
        }
    }

    function closeModal(e) { 
        // 只有点击背景或关闭按钮才关闭弹窗，点击图片本身不关闭
        if (e && e.target.id !== 'modal' && !e.target.classList.contains('modal-close')) return;
        document.getElementById('modal').style.display = 'none'; 
        document.body.style.overflow = 'auto'; 
    }

    function prevImage(e) {
        if(e) e.stopPropagation();
        if (currentData.items && currentData.items.length > 0) {
            currentModalIndex = (currentModalIndex - 1 + currentData.items.length) % currentData.items.length;
            updateModalUI();
        }
    }

    function nextImage(e) {
        if(e) e.stopPropagation();
        if (currentData.items && currentData.items.length > 0) {
            currentModalIndex = (currentModalIndex + 1) % currentData.items.length;
            updateModalUI();
        }
    }

    // 弹窗内部的投票按钮触发事件
    function modalToggleVote(e) {
        if(e) e.stopPropagation();
        const item = currentData.items[currentModalIndex];
        if(!item) return;
        
        const groupName = item.group || '默认分组';
        const log = getLocalLog();
        const groupLog = log[groupName] || [];
        const isSelected = groupLog.includes(currentModalIndex);
        const votesLeft = globalMaxVotes - groupLog.length;

        if (!isSelected && votesLeft <= 0) {
            showToast("⛔ 本组票数已用尽", "⛔");
            return;
        }

        toggleVote(currentModalIndex, groupName);
        updateModalUI(); // 投票后刷新弹窗按钮 UI
    }

    // 监听键盘方向键，实现快捷翻页
    document.addEventListener('keydown', function(e) {
        if (document.getElementById('modal').style.display === 'flex') {
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'Escape') closeModal({target: document.getElementById('modal')});
        }
    });

    // --- 后台功能 (维持不变) ---
    function toggleAdmin() {
        if (!isAdmin) {
            if (prompt("验证:") === "123456") { 
                isAdmin = true; 
                document.getElementById('admin-panel').style.display = 'block'; 
                if (!adminDirty) renderAdminView(currentData.items || []);
                updateDashboard(currentData);
                updateGroupSuggestions(currentData.items || []);
                if (!adminDirty) document.getElementById('maxVoteInput').value = globalMaxVotes;
            }
        } else { 
            isAdmin = false; 
            document.getElementById('admin-panel').style.display = 'none'; 
        }
    }

    function updateDashboard(data) {
        const items = data.items || [];
        document.getElementById('stat-headcount').innerText = data.headcount || 0;
        const total = items.reduce((sum, item) => sum + (item.votes || 0), 0);
        document.getElementById('stat-totalvotes').innerText = total;
        const groupCounts = {};
        items.forEach(i => { const g = i.group || '默认'; groupCounts[g] = (groupCounts[g] || 0) + (i.votes || 0); });
        let topGroup = '-', maxVal = -1;
        Object.entries(groupCounts).forEach(([name, count]) => { if(count > maxVal) { maxVal = count; topGroup = name; } });
        document.getElementById('stat-topgroup').innerText = total === 0 ? '-' : topGroup;
    }

    function updateGroupSuggestions(items) {
        const groups = new Set();
        items.forEach(item => { if(item.group) groups.add(item.group); });
        if(groups.size === 0) { groups.add("");  }
        const datalist = document.getElementById('group-suggestions');
        datalist.innerHTML = '';
        groups.forEach(g => {
            const option = document.createElement('option');
            option.value = g;
            datalist.appendChild(option);
        });
    }

    function refreshLocalSuggestions() {
        const groups = new Set();
        (currentData.items || []).forEach(item => { if(item.group) groups.add(item.group); });
        document.querySelectorAll('.edit-group').forEach(input => {
            const val = input.value.trim();
            if(val) groups.add(val);
        });
        const datalist = document.getElementById('group-suggestions');
        datalist.innerHTML = '';
        groups.forEach(g => {
            const option = document.createElement('option');
            option.value = g;
            datalist.appendChild(option);
        });
    }

    function renderAdminView(items) {
        const list = document.getElementById('admin-list');
        list.innerHTML = '';
        items.forEach((item, index) => list.appendChild(createAdminRow(item, index)));
        editorBaseline = metadataSignature(currentData);
    }
    function addNewRow() {
        if (saving) return;
        document.getElementById('admin-list').appendChild(createAdminRow({}, null));
        markAdminDirty();
    }
    
    function createAdminRow(item, index) {
        const div = document.createElement('div'); div.className = 'admin-item';
        div.dataset.originalIndex = index == null ? '' : String(index);
        div.innerHTML = `
            <div style="flex:0.5;display:flex;flex-direction:column;gap:5px">
                <label style="font-size:10px;color:#aaa">组名</label>
                <input class="edit-group" list="group-suggestions" placeholder="选择或输入" oninput="refreshLocalSuggestions()" style="padding:5px;border:1px solid #ddd;border-radius:4px">
            </div>
            <div style="flex:1;display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:#aaa">名称</label><input class="edit-name" placeholder="导入图片后自动填写" style="padding:5px;border:1px solid #ddd;border-radius:4px"></div>
            <div class="drop-zone" tabindex="0" role="button" aria-label="选择或拖入图片" ondragover="event.preventDefault()" ondrop="handleDrop(event,this)" onpaste="handlePaste(event,this)"><span class="image-preview">📷 拖入 / 点击选图</span><input type="file" hidden accept="image/*" onchange="handleFileSelect(event,this.parentElement)"><input type="hidden" class="edit-url"></div>
            <button class="remove-row" title="移除这项" style="background:#ff7675;color:white;border:none;border-radius:4px;padding:0 10px;">✕</button>`;
        div.querySelector('.edit-group').value = item.group || '';
        div.querySelector('.edit-name').value = item.name || '';
        const zone = div.querySelector('.drop-zone');
        setImagePreview(zone, item.url || '');
        zone.addEventListener('click', event => {
            if (saving || zone.dataset.processing || event.target.tagName === 'INPUT') return;
            zone.querySelector('input[type="file"]').click();
        });
        zone.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); zone.click(); }
        });
        div.querySelector('.remove-row').addEventListener('click', () => {
            if (saving || processingImages) return;
            if (confirm('移除这个选项？保存更新后才会生效。')) { div.remove(); markAdminDirty(); }
        });
        return div;
    }

    function setImagePreview(zone, url) {
        zone.querySelector('.edit-url').value = url;
        const preview = zone.querySelector('.image-preview');
        preview.textContent = url ? '' : '📷 拖入 / 点击选图';
        if (url) { const image = document.createElement('img'); image.src = url; image.className = 'preview-thumb'; image.alt = '图片预览'; preview.appendChild(image); }
    }

    function exportData() {
        const items = currentData.items || [];
        if (items.length === 0) return alert("暂无数据");
        let csv = `\uFEFF参与总人数: ${currentData.headcount || 0}\n分组,名称,票数\n`;
        [...items].sort((a,b)=>(a.group||"").localeCompare(b.group||"")||(b.votes-a.votes)).forEach(i=>{ csv += `${(i.group||"默认").replace(/,/g,"，")},${(i.name||"未命名").replace(/,/g,"，")},${i.votes||0}\n`; });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
        link.download = `Spark投票数据_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }
    
    function resetAllVotes() {
        const c = Math.floor(1000+Math.random()*9000);
        if(prompt(`验证码:${c}`) == c) {
            const ni = (currentData.items||[]).map(i=>({...i, votes:0}));
            db.ref('sparkVote').update({ items: ni, headcount: 0, round: (currentData.round||0)+1 }).then(()=>alert("已重置"));
        }
    }
    function deleteAllItems() { if(confirm("确认删除？")) db.ref('sparkVote/items').set([]); }
    function handleDrop(e,z){e.preventDefault();const f=e.dataTransfer.files[0];if(f)processFile(f,z);}
    function handlePaste(e,z){const i=(e.clipboardData||e.originalEvent.clipboardData).items;for(let x of i)if(x.type.includes("image")){e.preventDefault();processFile(x.getAsFile(),z);return;}}
    function handleFileSelect(e,z){if(e.target.files[0])processFile(e.target.files[0],z);}
    
    async function processFile(file, zone) {
        if (saving || zone.dataset.processing) return false;
        processingImages++;
        zone.dataset.processing = 'true';
        zone.classList.add('processing');
        document.getElementById('save-button').disabled = true;
        markAdminDirty();
        try {
            const url = await prepareImage(file);
            setImagePreview(zone, url);
            const name = zone.closest('.admin-item').querySelector('.edit-name');
            if (!name.value.trim()) name.value = file.name.replace(/\.[^.]+$/, '') || '未命名图片';
            setSaveStatus('图片已就绪，请点击“保存更新”。');
            return true;
        } catch (error) {
            setSaveStatus(`${file.name}：${error.message}。原图片已保留。`, 'error');
            return false;
        } finally {
            processingImages--;
            delete zone.dataset.processing;
            zone.classList.remove('processing');
            document.getElementById('save-button').disabled = saving || processingImages > 0;
            zone.querySelector('input[type="file"]').value = '';
        }
    }

    function prepareImage(file) {
        return new Promise((resolve, reject) => {
            if (!file || !(/^image\//.test(file.type) || /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.name))) return reject(new Error('请选择浏览器支持的图片'));
            if (file.size > 30 * 1024 * 1024) return reject(new Error('图片超过 30 MB，请缩小后重试'));
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('图片读取失败，请重试'));
            reader.onabort = () => reject(new Error('图片读取已中断'));
            reader.onload = () => {
                const image = new Image();
                image.onerror = () => reject(new Error('无法识别这张图片，请改用 PNG、JPG 或 WebP'));
                image.onload = () => {
                    try {
                        const scale = Math.min(1, 1920 / image.width, 1920 / image.height);
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(image.width * scale));
                        canvas.height = Math.max(1, Math.round(image.height * scale));
                        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                        const url = canvas.toDataURL('image/webp', 0.88);
                        if (!url.startsWith('data:image/') || url.length > 8 * 1024 * 1024) throw new Error('图片仍过大，请缩小后重试');
                        resolve(url);
                    } catch (error) { reject(error); }
                };
                image.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function saveAll() {
        if (saving) return;
        if (processingImages) return setSaveStatus('图片正在处理，请稍候再保存。', 'error');
        if (!dataLoaded || !databaseConnected) return setSaveStatus('尚未连接到服务器，内容仍保留在当前页面，请连接恢复后再保存。', 'error');
        const rows = Array.from(document.querySelectorAll('#admin-list .admin-item'));
        const drafts = [];
        for (const [index, row] of rows.entries()) {
            const name = row.querySelector('.edit-name').value.trim();
            const url = row.querySelector('.edit-url')?.value;
            if (!name || !url) return setSaveStatus(`第 ${index + 1} 项缺少${!name ? '名称' : '图片'}，请补全后保存。所有编辑内容已保留。`, 'error');
            const originalIndex = row.dataset.originalIndex;
            drafts.push({ name, url, group: row.querySelector('.edit-group').value.trim() || '默认分组',
                originalIndex: originalIndex === '' || originalIndex == null ? null : Number(originalIndex) });
        }
        const maxVotes = Number(document.getElementById('maxVoteInput').value);
        if (!Number.isInteger(maxVotes) || maxVotes < 1 || maxVotes > 99) return setSaveStatus('每组限投票数须为 1 至 99 的整数。', 'error');
        if (new TextEncoder().encode(JSON.stringify(drafts)).length > 15 * 1024 * 1024) return setSaveStatus('图片总量超过单次保存容量，请缩小图片后再保存。编辑内容已保留。', 'error');
        saving = true;
        document.querySelectorAll('#admin-panel input, #admin-panel button').forEach(control => { control.disabled = true; });
        setSaveStatus('正在保存，等待服务器确认…');
        const noticeTimer = setTimeout(() => setSaveStatus('服务器尚未确认，请保留当前页面，连接恢复后会继续保存。'), 15000);
        try {
            const result = await db.ref('sparkVote').transaction(server => {
                const latest = server || { items: [], round: 0, maxVotes: 1, headcount: 0 };
                if (metadataSignature(latest) !== editorBaseline) return;
                const items = drafts.map(draft => ({ name: draft.name, group: draft.group, url: draft.url,
                    votes: draft.originalIndex == null ? 0 : (latest.items?.[draft.originalIndex]?.votes || 0) }));
                return { ...latest, items, maxVotes };
            }, undefined, false);
            if (!result.committed) throw new Error('其他管理员已修改选项，请先保留当前编辑内容，核对最新数据后再操作');
            currentData = result.snapshot.val() || { items: [] };
            globalMaxVotes = currentData.maxVotes || 1;
            adminDirty = false;
            renderAdminView(currentData.items || []);
            renderUserView(currentData.items || []);
            updateDashboard(currentData);
            refreshLocalSuggestions();
            setSaveStatus(`保存成功，服务器已确认 ${drafts.length} 个选项，刷新页面后仍会保留。`, 'success');
        } catch (error) {
            setSaveStatus(`保存失败：${error.message || error.code}。编辑内容已保留，请勿关闭页面。`, 'error');
        } finally {
            clearTimeout(noticeTimer);
            saving = false;
            document.querySelectorAll('#admin-panel input, #admin-panel button').forEach(control => { control.disabled = false; });
        }
    }
</script>
